services:
  - type: web
    name: home2here
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: DEMO_FALLBACK
        value: "false"
      - key: QLOO_BASE_URL
        value: https://hackathon.api.qloo.com
      - key: QLOO_API_KEY
        sync: false
